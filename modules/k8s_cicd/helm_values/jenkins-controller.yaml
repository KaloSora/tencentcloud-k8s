# Jenkins controller configuration is kept separate from the ephemeral agent
# configuration in jenkins.yaml.
controller:
  # Do not execute builds on the persistent controller pod.
  numExecutors: 0
  jenkinsUrlProtocol: "http"

  admin:
    username: "${jenkins_admin_username}"
    password: "${jenkins_admin_password}"
    createSecret: true

  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostName: "${jenkins_url}"
    path: "/"
    pathType: Prefix
    tls: []
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Resolve required dependency versions instead of pulling the latest ones,
  # which can require a newer JCasC plugin than the chart's pinned version.
  installLatestPlugins: false

  # Job DSL supplies the JCasC `jobs` root used to create the multibranch
  # pipeline job. Repository polling avoids coupling Jenkins to SCM webhooks.
  additionalPlugins:
    - "job-dsl:3732.v9a_c49a_61a_313"

  JCasC:
    defaultConfig: true
    overwriteConfiguration: false
    configScripts:
      bootstrap-pipeline: |
        jobs:
          - script: >
              multibranchPipelineJob('${jenkins_pipeline_job_name}') {
                description('Application multibranch pipeline managed by Jenkins Configuration as Code.')
                branchSources {
                  git {
                    id('${jenkins_pipeline_scm_id}')
                    remote('${jenkins_pipeline_repository_url}')
                    includes('${jenkins_pipeline_branch_includes}')
                    excludes('${jenkins_pipeline_branch_excludes}')
                  }
                }
                factory {
                  workflowBranchProjectFactory {
                    scriptPath('${jenkins_pipeline_script_path}')
                  }
                }
                triggers {
                  periodicFolderTrigger {
                    interval('${jenkins_pipeline_scan_interval}')
                  }
                }
                orphanedItemStrategy {
                  discardOldItems {
                    numToKeep(20)
                  }
                }
              }

serviceAccount:
  create: true
  name: "${jenkins_controller_service_account_name}"
  automountServiceAccountToken: true
