controller:
  healthCheck:
    initialDelaySeconds: 60
    periodSeconds: 10
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  kind: DaemonSet
  ingressClassResource:
    default: true
  image:
    digest: ""
  service:
    type: ClusterIP
  # nodeSelector:
  #   purpose: devops

  # Prefer DevOps nodes, but allow scheduling on other nodes
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: purpose
                operator: In
                values:
                  - devops

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      
  ### Security hardening
  # It will auto create CAP_NET_BIND_SERVICE after drop all capabilities
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault