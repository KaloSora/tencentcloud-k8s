apiVersion: v1 
kind: Pod      
metadata:      
  name: volume-emptydir-mem
spec:          
  containers:  
    - name: myapp
      image: registry.cn-hangzhou.aliyuncs.com/wangyangshare/share:myappv1.0
      ports:   
        - containerPort: 80
      resources:
        limits: 
          cpu: "1"
          memory: 1024Mi
        requests:
          cpu: "1"
          memory: 1024Mi
      volumeMounts:
        - name: mem-volume
          mountPath: /data
  volumes:     
    - name: mem-volume
      emptyDir:
        medium: Memory
        sizeLimit: 500Mi