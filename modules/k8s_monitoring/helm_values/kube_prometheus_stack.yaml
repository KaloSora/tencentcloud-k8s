# ============================================================
# kube-prometheus-stack
# Chart: 88.6.1
# ============================================================


# ============================================================
# CRDs
# ============================================================

crds:
  enabled: true

  # Keep disabled unless you explicitly need CRD upgrade jobs.
  # If enabled later, resources are already defined below.
  upgradeJob:
    enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi


# ============================================================
# Prometheus Operator
# ============================================================

prometheusOperator:
  enabled: true

  # Main Prometheus Operator container
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # ----------------------------------------------------------
  # Prometheus Operator Admission Webhook
  # ----------------------------------------------------------
  admissionWebhooks:

    enabled: true

    # The patch Job creates/patches the webhook configuration.
    # This is important when ResourceQuota is enabled.
    patch:
      enabled: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # IMPORTANT:
    # kube-prometheus-stack 88.6.1 does NOT expose
    # createSecretJob.resources.
    #
    # Therefore do NOT add:
    #
    # createSecretJob:
    #   resources: ...
    #
    # A namespace LimitRange is recommended to provide
    # default resources for this Helm hook Job.

    # The admission webhook deployment is disabled by default.
    # If you enable it later, configure its resources here.
    deployment:
      enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # ----------------------------------------------------------
  # Config Reloader
  # ----------------------------------------------------------
  #
  # This resource configuration is used by Prometheus Operator
  # generated Prometheus / Alertmanager workloads.
  #
  # It is especially important because ResourceQuota checks
  # init-config-reloader and config-reloader containers too.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # ----------------------------------------------------------
  # Scheduling
  # ----------------------------------------------------------

  # nodeSelector:
  #   purpose: devops

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: purpose
                operator: In
                values:
                  - devops


# ============================================================
# Prometheus
# ============================================================

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:

    replicas: 1

    # ----------------------------------------------------------
    # Retention
    # ----------------------------------------------------------

    retention: 15d
    retentionSize: "40GB"

    # ----------------------------------------------------------
    # Scraping
    # ----------------------------------------------------------

    scrapeInterval: 30s
    evaluationInterval: 30s

    # ----------------------------------------------------------
    # Resources
    # ----------------------------------------------------------

    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 6Gi

    # ----------------------------------------------------------
    # Persistent Storage
    # ----------------------------------------------------------

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class_name}"

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 50Gi

    # ----------------------------------------------------------
    # ServiceMonitor Discovery
    # ----------------------------------------------------------

    # Discover ServiceMonitors from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

    # Discover PodMonitors from all namespaces
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}

    # Discover PrometheusRules from all namespaces
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    # ----------------------------------------------------------
    # Scheduling
    # ----------------------------------------------------------

    # nodeSelector:
    #   purpose: devops

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: purpose
                  operator: In
                  values:
                    - devops


# ============================================================
# Alertmanager
# ============================================================

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    # ----------------------------------------------------------
    # Resources
    # ----------------------------------------------------------

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    # ----------------------------------------------------------
    # Persistent Storage
    # ----------------------------------------------------------

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class_name}"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi


# ============================================================
# kube-state-metrics
# ============================================================

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # nodeSelector:
  #   purpose: devops

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
      preference:
          matchExpressions:
            - key: purpose
              operator: In
              values:
                - devops


# ============================================================
# Node Exporter
# ============================================================

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # nodeSelector:
  #   purpose: devops

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
      preference:
          matchExpressions:
            - key: purpose
              operator: In
              values:
                - devops


# ============================================================
# Kubelet / cAdvisor
# ============================================================

kubelet:
  enabled: true

  serviceMonitor:
    enabled: true
    kubelet: true
    cAdvisor: true
    probes: true
    resource: true


# ============================================================
# Kubernetes Control Plane
# ============================================================

kubeApiServer:
  enabled: true

coreDns:
  enabled: true

kubeProxy:
  enabled: true

# These are disabled because your cluster does not expose
# the corresponding control-plane metrics endpoints.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false


# ============================================================
# Default Prometheus Rules
# ============================================================

defaultRules:
  create: true
  rules:
    alertmanager: true
    # etcd metrics are not enabled in this configuration
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true


# ============================================================
# Grafana
# ============================================================

grafana:
  enabled: true

  # ----------------------------------------------------------
  # Authentication
  # ----------------------------------------------------------
  adminUser: admin
  adminPassword: "${grafana_password}"

  # ----------------------------------------------------------
  # Persistent Storage
  # ----------------------------------------------------------
  persistence:
    enabled: true
    storageClassName: "${storage_class_name}"
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  # ----------------------------------------------------------
  # Resources
  # ----------------------------------------------------------
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # ----------------------------------------------------------
  # Scheduling
  # ----------------------------------------------------------

  # nodeSelector:
  #   purpose: devops

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: purpose
                operator: In
                values:
                  - devops

  # ----------------------------------------------------------
  # Service
  # ----------------------------------------------------------
  service:
    type: ClusterIP
    port: 80

  # ----------------------------------------------------------
  # Ingress
  # ----------------------------------------------------------
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - "${grafana_url}"
    path: /
    pathType: Prefix

  # ----------------------------------------------------------
  # Default Dashboards
  # ----------------------------------------------------------
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  defaultDashboardsEditable: true
  defaultDashboardsInterval: 30s

  # ----------------------------------------------------------
  # Loki Datasource
  # ----------------------------------------------------------
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.${monitoring_namespace}.svc.cluster.local:3100
      isDefault: false

      jsonData:
        maxLines: 1000