crds:
  enabled: true

# ============================================================
# Prometheus Operator
# ============================================================

prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector:
    purpose: devops


# ============================================================
# Prometheus
# ============================================================

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    replicas: 1

    retention: 15d
    retentionSize: "40GB"

    scrapeInterval: 30s
    evaluationInterval: 30s

    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 6Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class_name}"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    ### Discover ServiceMonitors / PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    nodeSelector:
      purpose: devops


# ============================================================
# Alertmanager
# ============================================================

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    nodeSelector:
      purpose: devops

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class_name}"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi


# ============================================================
# kube-state-metrics
# ============================================================

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector:
    purpose: devops


# ============================================================
# Node Exporter
# ============================================================

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  nodeSelector:
    purpose: devops


# ============================================================
# Kubelet / cAdvisor
# ============================================================

kubelet:
  enabled: true

  serviceMonitor:
    enabled: true
    kubelet: true
    cAdvisor: true
    probes: true
    resource: true


# ============================================================
# Kubernetes Control Plane
# ============================================================

kubeApiServer:
  enabled: true

coreDns:
  enabled: true

kubeProxy:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false


# ============================================================
# Prometheus Rules
# ============================================================

defaultRules:
  create: true

  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true


# ============================================================
# Grafana
# ============================================================

grafana:
  enabled: true

  adminUser: admin
  adminPassword: "${grafana_password}"

  persistence:
    enabled: true
    storageClassName: "${storage_class_name}"
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  nodeSelector:
    purpose: devops

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    ingressClassName: nginx

    hosts:
      - "${grafana_url}"

    path: /
    pathType: Prefix

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  defaultDashboardsEditable: true
  defaultDashboardsInterval: 30s

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.${monitoring_namespace}.svc.cluster.local:3100
      isDefault: false

      jsonData:
        maxLines: 1000